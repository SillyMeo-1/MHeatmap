name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6.11,<7"

      - name: Sample scripts + render self test
        run: |
          python tools/make_sample.py build/sample
          python app.py --selftest build/sample

      - name: Build exe
        run: python -m PyInstaller --noconfirm MHeatmap.spec

      - name: Package zip
        run: |
          New-Item -ItemType Directory -Force -Path dist/package | Out-Null
          Copy-Item dist/MHeatmap.exe dist/package/
          Copy-Item packaging/README.txt dist/package/README.txt
          Compress-Archive -Path dist/package/* -DestinationPath dist/MHeatmap.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: MHeatmap-windows
          path: |
            dist/MHeatmap.exe
            dist/MHeatmap.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MHeatmap.exe
            dist/MHeatmap.zip
          generate_release_notes: true
